# https://developer.atlassian.com/platform/forge/manifest-reference/
modules:
  jira:dashboardGadget:
    - key: jira-dashboard-gadget
      title: Worklog Gadget
      description: Worklog por usuário nos últimos N dias
      thumbnail: https://www.svgrepo.com/show/511175/timer.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main
  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: src/frontend/dist

permissions:
  content:
    styles:
      - unsafe-inline
  scopes:
    - read:jira-work
    - read:jira-user

app:
  id: ari:cloud:ecosystem::app/a546d3b1-9757-447c-8403-6513899d61cb
  runtime:
    name: nodejs20.x
